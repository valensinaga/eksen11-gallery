<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin — Galeri Eksen 11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="adm">
<main class="inner pad">
  <h1>Admin Eksen 11</h1>
  <p class="status" id="msg" role="status"></p>

  <form id="login" class="stack">
    <h2>Masuk</h2>
    <label>Email<input type="email" id="email" autocomplete="username" required></label>
    <label>Kata sandi<input type="password" id="pass" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Masuk</button>
  </form>

  <div id="panel" hidden>
    <div class="cta"><a class="btn ghost" href="index.html">Lihat situs</a><button class="btn ghost" id="logout" type="button">Keluar</button></div>
    <form id="form" class="stack">
      <h2 id="formTitle">Tambah karya</h2>
      <label>Judul<input type="text" id="judul" required></label>
      <label>Nama fotografer<input type="text" id="fotografer" required></label>
      <label>Asal (tulis "Open Submission" atau nama UKM)<input type="text" id="asal" list="asalList" value="Open Submission" required></label>
      <datalist id="asalList"><option value="Open Submission"></datalist>
      <label>Deskripsi<textarea id="deskripsi" rows="5"></textarea></label>
      <label>Gambar<input type="file" id="file" accept="image/*"></label>
      <label>Status penjualan
        <select id="jual"><option value="tidak">Tidak dijual</option><option value="dijual">Dijual</option><option value="terjual">Terjual</option></select>
      </label>
      <label class="check"><input type="checkbox" id="draft"> Sembunyikan dari situs (draft)</label>
      <div class="cta"><button class="btn" type="submit" id="simpan">Simpan</button><button class="btn ghost" type="button" id="batal" hidden>Batal edit</button></div>
    </form>
    <h2>Daftar karya</h2>
    <ul class="list" id="list"></ul>
  </div>
</main>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
